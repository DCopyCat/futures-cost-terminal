name: Offline regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest tomlkit
      - name: Compile source code
        run: python -m compileall -q app.py core.py company_fee_view.py margin_display.py historical_margin.py exchange_fee_provider.py so_listing.py
      - name: Run offline tests (no market-data access)
        run: python -m pytest -q
